<script type="module">
// PEGA TU CONFIG DE FIREBASE AQUI - Son 6 lineas nada mas
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "TU-PROYECTO.firebaseapp.com",
  projectId: "TU-PROYECTO",
  storageBucket: "TU-PROYECTO.appspot.com",
  messagingSenderId: "123...",
  appId: "1:123..."
};
// FIN CONFIG

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('btnSombraReal').addEventListener('click', async () => {
  const n = document.getElementById('ghostName').value;
  const m = document.getElementById('ghostMsg').value;
  if(!n || !m) return alert("Escribe nombre y sombra");
  await addDoc(collection(db, "sombras"), {nombre:n, mensaje:m, fecha:serverTimestamp()});
  alert("SOMBRA GUARDADA PARA SIEMPRE");
  location.reload();
});

async function verSombras(){
  const q = query(collection(db, "sombras"), orderBy("fecha","desc"));
  const snap = await getDocs(q);
  let html="";
  snap.forEach(d=>{ html+=`<div style="border:1px dashed #00ff41;padding:8px;margin:6px 0"><b>${d.data().nombre}:</b> ${d.data().mensaje}</div>` });
  document.getElementById('listaSombras').innerHTML = html;
}
verSombras();
</script>
