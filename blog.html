<script>
/*
  Versión final consolidada:
  - Contador global: CountAPI (api.countapi.xyz) -> incrementa en cada carga.
  - Contador por país: ipapi.co + CountAPI por país (key visitors-xx).
  - "Fantasmas" (comentarios): lee comments de un issue en tu repo GitHub (maneja rate-limits).
  - Frecuencias reducidas para evitar hitting rate limits.
  - No se usan tokens en el cliente.
*/

/* ---------- CONFIG ---------- */
const GITHUB_OWNER = 'Spikeblack009';
const GITHUB_REPO = 'spikeblack009.github.io';
const COUNTAPI_NAMESPACE = 'spikeblack009.github.io'; // usado en CountAPI: /hit/namespace/key
/* ---------------------------- */

/* --- updateGhosts: obtiene comentarios del issue relacionado (utterances) --- */
async function updateGhosts(){
  const el = document.getElementById('ghost-counter');

  // Candidate strings para identificar el issue asociado a esta página
  const path = (location.pathname || '/blog.html');
  const candidates = [
    path,
    path.replace(/^\//,''),
    'blog.html',
    'post 001',
    'el inicio del círculo',
    'inicio del círculo'
  ].map(s => String(s).toLowerCase());

  try{
    const apiUrl = `https://api.github.com/repos/${encodeURIComponent(GITHUB_OWNER)}/${encodeURIComponent(GITHUB_REPO)}/issues?state=all&per_page=100`;
    const res = await fetch(apiUrl);
    if(!res.ok){
      if(res.status === 403){
        // revisar cabeceras de rate limit si están disponibles
        const remaining = res.headers.get('X-RateLimit-Remaining');
        const reset = res.headers.get('X-RateLimit-Reset');
        if(remaining === '0'){
          const resetTs = reset ? new Date(parseInt(reset,10)*1000) : null;
          el.textContent = 'FANTASMAS EN EL CÍRCULO: límite API GitHub alcanzado (intenta más tarde)';
          console.warn('GitHub rate limit reached. Reset at', resetTs);
          return;
        }
      }
      el.textContent = 'FANTASMAS EN EL CÍRCULO: error al consultar GitHub';
      console.error('GitHub API error', res.status, await res.text());
      return;
    }

    const data = await res.json();
    const issue = data.find(i => {
      const text = ((i.title||'') + ' ' + (i.body||'')).toLowerCase();
      return candidates.some(c => text.includes(c));
    });

    const comments = issue ? issue.comments : 0;
    el.textContent = `FANTASMAS EN EL CÍRCULO (Almas que han hablado): ${comments}`;
  }catch(e){
    console.error('updateGhosts error', e);
    el.textContent = 'FANTASMAS EN EL CÍRCULO (Almas que han hablado): 0 - Sé el primero';
  }
}
// Ejecutar al cargar y luego cada 5 minutos (12 req/h < 60/h limit)
updateGhosts();
setInterval(updateGhosts, 5 * 60 * 1000);


/* --- updateTotal: incrementa y muestra total global usando CountAPI --- */
async function updateTotal(){
  const el = document.getElementById('total-counter');
  try{
    // Incrementa el contador en CountAPI y devuelve {value: N}
    const res = await fetch(`https://api.countapi.xyz/hit/${encodeURIComponent(COUNTAPI_NAMESPACE)}/visits`);
    if(!res.ok) throw new Error('countapi error ' + res.status);
    const data = await res.json();
    el.textContent = data.value;
  }catch(e){
    console.error('updateTotal error', e);
    el.textContent = '—';
  }
}
updateTotal();
// Refrescar sólo cada 10 minutos (lectura).
setInterval(updateTotal, 10 * 60 * 1000);


/* --- updateCountryCount: detecta país del visitante y actualiza contador por país --- */
async function updateCountryCount(){
  const flagEmojiEl = document.getElementById('flag-emoji');
  const flagCountEl = document.getElementById('flag-count');

  try{
    // Servicio geo IP (público, puede tener límites). ipapi.co suele permitir consultas simples.
    const geoRes = await fetch('https://ipapi.co/json/');
    if(!geoRes.ok) throw new Error('geo lookup failed ' + geoRes.status);
    const geo = await geoRes.json();
    const countryCode = (geo.country_code || '').toLowerCase();
    const countryName = geo.country_name || geo.country || 'Desconocido';

    // Convertir a emoji de bandera
    function countryCodeToEmoji(cc){
      if(!cc || cc.length !== 2) return '🏳️';
      const OFFSET = 127397;
      return cc.toUpperCase().split('').map(c => String.fromCodePoint(c.charCodeAt(0) + OFFSET)).join('');
    }
    flagEmojiEl.textContent = countryCodeToEmoji(countryCode || 'UN');

    // Incrementar contador por país en CountAPI (key: visitors-xx)
    const key = `visitors-${countryCode || 'unknown'}`;
    const res = await fetch(`https://api.countapi.xyz/hit/${encodeURIComponent(COUNTAPI_NAMESPACE)}/${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('countapi country error ' + res.status);
    const data = await res.json(); // {value: N}
    flagCountEl.textContent = `${data.value} (${countryName})`;
  }catch(e){
    console.error('updateCountryCount error', e);
    flagEmojiEl.textContent = '🏳️';
    flagCountEl.textContent = '—';
  }
}
updateCountryCount();
setInterval(updateCountryCount, 30 * 60 * 1000); // actualizar cada 30 min


/* ---------- SUGERENCIAS/NOTAS ----------
- CountAPI es práctico y sin servidor, pero es público y manipulable. Para métricas serias, guárdalas en un backend propio.
- Si necesitas más cuota para llamadas a GitHub (por ejemplo, para soporte real-time), crea una función serverless que haga la llamada con un token y exponga un endpoint público que el cliente consulte.
- Para evitar contar tus propias visitas, añade una comprobación (cookie, parámetro ?debug, IP whitelist) antes de llamar a CountAPI.
- Si ves 403 desde GitHub en el navegador, revisa la consola y las cabeceras X-RateLimit-*.
-------------------------------------- */
</script>
