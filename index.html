<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST DARK CIRCLE</title>
<style>
:root{--neon:#00ff41;--dim:#1a5c10}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e6ffe6;font-family:monospace}
header{display:flex;align-items:center;gap:10px;padding:12px;background:#050505;border-bottom:1px solid var(--neon);position:sticky;top:0}
header img{width:40px;height:40px;border-radius:50%;border:2px solid var(--neon)}
header h1{color:var(--neon);font-size:1rem}
main{max-width:700px;margin:20px auto;padding:0 12px}
.card{border:1px solid var(--neon);background:#0a0f0a;padding:18px;margin-bottom:15px;border-radius:8px}
.card input,.card textarea{width:100%;background:#000;border:1px solid var(--dim);color:var(--neon);padding:12px;margin:6px 0;border-radius:6px}
.btn{width:100%;background:var(--neon);color:#000;border:none;padding:13px;font-weight:bold;cursor:pointer;border-radius:6px}
.sombra{border:1px solid #222;border-left:3px solid #00ff41;background:#000;padding:12px;margin:10px 0;border-radius:6px;word-break:break-word}
.sombra a{color:#00ff41;text-decoration:underline;word-break:break-all}
</style>
</head>
<body>
<header><img src="logo.png"><h1>GHOST DARK CIRCLE</h1></header>
<main>
<div class="card">Bienvenido al abismo. GHOST DARK CIRCLE de SPIKE BLACK.<br><em>"La oscuridad no es el final. Es donde comienza todo."</em></div>
<div class="card">
<p style="color:var(--neon)">FUISTE ELEGIDO.</p>
<input id="ghostName" placeholder="Tu nombre">
<textarea id="ghostMsg" placeholder="Tu mensaje + link https://..."></textarea>
<button class="btn" id="btnSombra">DEJAR SOMBRA</button>
<p id="status" style="font-size:11px;color:#888;text-align:center;margin-top:8px"></p>
</div>
<div style="border:1px solid #00ff41;padding:18px;border-radius:10px;background:#0d0d0d">
<p id="counter" style="color:#00ff41;font-weight:bold">CARGANDO...</p>
<div id="lista"></div>
<div style="border-top:1px dashed #222;margin-top:15px;padding-top:10px;text-align:center">
<span style="background:#00ff41;color:#000;padding:2px 8px;border-radius:4px;font-weight:bold">SOMBRAS</span> <span id="total" style="color:#00ff41">0</span>
<p id="visitas" style="color:#666;font-size:11px;margin-top:8px">Visitas: 82</p>
</div>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAR7kW0NoMCaOaGF1iuD5qWXGTYhFhC2KU",
  authDomain: "ghost-dark-circle.firebaseapp.com",
  databaseURL: "https://ghost-dark-circle-default-rtdb.firebaseio.com",
  projectId: "ghost-dark-circle",
  storageBucket: "ghost-dark-circle.firebasestorage.app",
  messagingSenderId: "1049315311255",
  appId: "1:1049315311255:web:00bc42fbffbd00beccb3d2"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const lista = document.getElementById('lista');
function linkify(t){ return t.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>') }
async function cargar(){
  try{
    const snap = await get(child(ref(db),'muro_dark_circle'));
    const v = await get(child(ref(db),'visitas_contador'));
    if(v.exists()) document.getElementById('visitas').textContent = 'Visitas: ' + v.val() + ' almas';
    lista.innerHTML="";
    if(!snap.exists()){ document.getElementById('counter').textContent="0 FANTASMAS - Sé el primero"; document.getElementById('total').textContent="0 almas"; return; }
    const arr = Object.values(snap.val()).reverse();
    document.getElementById('counter').textContent = 'FANTASMAS EN EL CÍRCULO: ' + arr.length;
    document.getElementById('total').textContent = arr.length + ' almas';
    arr.forEach(s=>{
      const d=document.createElement('div'); d.className='sombra';
      d.innerHTML = `<b style="color:#00ff41">${s.nombre||'Anónimo'}</b> <span style="color:#555;font-size:10px">${s.pais||''}</span><br><span style="color:#bbb">${linkify(s.mensaje||s.texto||'')}</span>`;
      lista.appendChild(d);
    });
  }catch(e){ document.getElementById('counter').textContent = 'Error: '+e.message }
}
document.getElementById('btnSombra').addEventListener('click', async ()=>{
  const nombre=document.getElementById('ghostName').value.trim();
  const mensaje=document.getElementById('ghostMsg').value.trim();
  const st=document.getElementById('status');
  if(!nombre||!mensaje){ st.textContent='Escribe nombre y mensaje'; return; }
  st.textContent='Guardando...';
  try{
    let pais='México'; try{ const r=await fetch('https://ipapi.co/json/').then(r=>r.json()); pais=r.country_name||'México'; }catch{}
    await push(ref(db,'muro_dark_circle'),{nombre,mensaje,pais,fecha:Date.now()});
    st.textContent='🕯️ Guardada para siempre'; document.getElementById('ghostName').value=''; document.getElementById('ghostMsg').value=''; cargar();
  }catch(e){ st.textContent='Error: '+e.message }
});
cargar();
</script>
</body>
</html>
