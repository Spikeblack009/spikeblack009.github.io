<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuyoo - Spike Black</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:90px}
.cover-wrap{width:88%;max-width:360px;aspect-ratio:1/1;margin:18px auto 0;background:#080808;border-radius:28px;border:2.5px solid #00ff88;box-shadow:0 0 18px rgba(0,255,136,.9),0 0 45px rgba(0,255,136,.5),inset 0 0 15px rgba(0,255,136,.15);overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}

/* LOGO FIJO - NO TIENE ANIMACION */
#artLogo{transform:none!important}

/* SOLO ESTO SE MUEVE */
.tt{text-align:center;margin-top:18px}
.tt h1{font-size:27px;font-weight:800;letter-spacing:-.3px}
.tt p{color:#9a9a9a;font-size:14px;margin-top:2px}
.tt span{color:#4a4a4a;font-size:11px;display:block;margin-top:4px}
@keyframes goLeft{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:translateX(0)}}
@keyframes goRight{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:translateX(0)}}
.tt.goL{animation:goLeft .32s ease}
.tt.goR{animation:goRight .32s ease}
.ctrl{max-width:380px;margin:22px auto 0;display:flex;justify-content:space-between;align-items:center;padding:0 28px}
.ctrl button{background:none;border:none;cursor:pointer}
.ic{width:22px;height:22px;stroke:#8e8e93;fill:none;stroke-width:1.7}
.heart{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7}
.play{width:66px;height:66px;background:#00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px #00ff88,0 0 40px rgba(0,255,136,.7)}
.barW{max-width:380px;margin:20px auto 0;padding:0 24px}
.bar{height:4px;background:#222;border-radius:10px;cursor:pointer}
.fill{height:100%;background:#00ff88;width:0%;border-radius:10px;box-shadow:0 0 6px #00ff88}
.time{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;color:#555}
.time b{color:#00ff88;font-weight:400}
.acts{max-width:380px;margin:18px auto 0;display:flex;justify-content:space-between;padding:0 20px}
.a{color:#5a5a5a;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:6px}
.a svg{width:18px;height:18px;stroke:#7a7a7a;fill:none;stroke-width:1.5}
.lyrics{max-width:380px;margin:26px auto 0;padding:0 18px}
.ly-h{display:flex;justify-content:space-between;font-size:10px;margin-bottom:8px}
.ly-h b:first-child{color:#00ff88}
.ly-h b:last-child{color:#00ff88;font-weight:400}
.lyrics p{font-size:12px;color:#6e6e73;line-height:1.8}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:8px 0 6px;font-size:8px;color:#555}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px}
.nav .on{color:#00ff88}
.playlist{max-width:380px;margin:18px auto 0;padding:0 18px}
.song-item{background:#111;border:1px solid #222;border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:11px;display:flex;justify-content:space-between;cursor:pointer;color:#fff}
.song-item.active{background:#00ff88;color:#000;border-color:#00ff88}
</style>
</head>
<body>

<audio id="rola" preload="auto"></audio>

<!-- ESTE LOGO NO SE MUEVE -->
<div class="cover-wrap" id="artLogo">
<img src="nuyoo.gif" onerror="this.src='https://i.imgur.com/QJ7l1aW.jpeg'">
</div>

<div class="tt" id="ttContainer">
<h1 id="songTitle">N
