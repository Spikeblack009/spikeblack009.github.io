<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nuyoo - Spike Black</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:90px}
.wrap{max-width:420px;margin:0 auto;padding:16px 18px 0}
.art-box{width:100%;aspect-ratio:1/1;background:#080808;border-radius:28px;border:2px solid #1aff80;box-shadow:0 0 20px rgba(26,255,128,.8),0 0 50px rgba(26,255,128,.35),inset 0 0 20px rgba(26,255,128,.1);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:transform .32s cubic-bezier(.4,0,.2,1)}
.art-box img{width:92%;height:92%;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 12px rgba(26,255,128,.8))}
.meta{text-align:center;margin-top:18px}
.meta h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.meta .artist{color:#aaa;font-size:15px;margin-top:2px}
.meta .sub{color:#555;font-size:12px;margin-top:4px}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding:0 10px}
.controls button{background:none;border:none}
.ic{width:24px;height:24px;stroke:#999;stroke-width:1.6;fill:none}
.ic.active{stroke:#1aff80}
.play{width:74px;height:74px;background:#1aff80;border-radius:50%;box-shadow:0 0 22px #1aff80,0 0 45px rgba(26,255,128,.6);display:flex;align-items:center;justify-content:center}
.bar-wrap{margin-top:22px}
.bar{height:4px;background:#222;border-radius:10px;position:relative;cursor:pointer}
.fill{height:100%;background:#1aff80;width:0%;border-radius:10px;box-shadow:0 0 6px #1aff80}
.times{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:#777}
.times b{color:#1aff80;font-weight:500}
.actions{display:flex;justify-content:space-between;margin-top:18px;padding:0 8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;color:#666;font-size:10px}
.act svg{width:20px;height:20px;stroke:#888;fill:none;stroke-width:1.7}
.lyrics{margin-top:26px}
.lyrics .head{display:flex;justify-content:space-between;color:#1aff80;font-size:11px;font-weight:700;letter-spacing:1px}
.lyrics .head span:last-child{color:#1aff80;font-weight:400;cursor:pointer}
.lyrics p{color:#8a8a8a;font-size:13px;line-height:1.7;margin-top:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #1a1a1a;display:flex;justify-content
