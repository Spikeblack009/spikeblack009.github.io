<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuyoo - Spike Black</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;padding-bottom:90px}
.art{width:88%;max-width:380px;aspect-ratio:1/1;margin:18px auto 0;border-radius:22px;overflow:hidden;border:2px solid #00ff88;box-shadow:0 0 25px #00ff88;background:#111;display:flex;align-items:center;justify-content:center}
.art img{width:100%;height:100%;object-fit:cover;display:block;background:#111}
.tt{text-align:center;margin-top:16px}.tt h1{font-size:26px;font-weight:800}.tt p{color:#aaa;font-size:14px}.tt span{color:#555;font-size:11px;display:block;margin-top:3px}
@keyframes left{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:translateX(0)}}
@keyframes right{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:translateX(0)}}
.tt.slideL{animation:left.35s ease}
.tt.slideR{animation:right.35s ease}
.playlist.slideL{animation:left.35s ease}
.playlist.slideR{animation:right.35s ease}
.ctrl{max-width:400px;margin:22px auto 0;display:flex;justify-content:space-between;align-items:center;padding:0 32px}.ctrl button{background:none;border:none}
.play{width:62px;height:62px;background:#00ff88!important;border-radius:50%;display:flex;align-items:center;justify-content:center}
.barW{max-width:400px;margin:20px auto 0;padding:0 24px}.bar{height:6px;background:#222;border-radius:10px}.fill{width:0%;height:100%;background:#00ff88;border-radius:10px}
.time{display:flex;justify-content:space-between;font-size:11px;color:#555;margin-top:6px}.time b{color:#00ff88}
.playlist{max-width:400px;margin:20px auto 0;padding:0 18px}.song-item{background:#1a1a1a;border:1px solid #222;border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;font-size:11px;color:#fff}
.song-item.active{background:#00ff88;color:#000;border-color:#00ff88}
</style>
</head>
<body>
<audio id="rola" preload="auto"></audio>

<!-- LOGO FIJO, NO SE MUEVE -->
<div class="art" id="artLogo"><img id="logoImg" src="nuyoo.gif" onerror="this.onerror=null; this.src='nuyoo.GIF'; this.onerror=function(){this.src='https://i.imgur.com/8Km9tLL.png'}"></div>

<div class="tt" id="ttContainer"><h1 id="songTitle">Nuyoo</h1><p id="songArtist">Spike Black</p><span id="songInfo">Nuyoo • Single</span></div>

<div class="ctrl">
<button id="backBtn" style="font-size:26px;color:#888">⏮</button>
<button class="play" id="playBtn"><svg id="ico" width="28" height="28" viewBox="0 0 24 24"><path fill="#000" d="M8 5.8v12.4L19 12z"/></svg></button>
<button id="nextBtn" style="font-size:26px;color:#888">⏭</button>
</div>

<div class="barW"><div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="time"><b id="cur">0:00</b><span id="dur">0:00</span></div></div>

<div class="playlist" id="playlistContainer">
<div style="font-size:10px;color:#00ff88;margin-bottom:10px">LISTA</div>
<div id="songsContainer"></div>
</div>

<script>
const rola=document.getElementById('rola');
const playBtn=document.getElementById('playBtn');
const backBtn=document.getElementById('backBtn');
const nextBtn=document.getElementById('nextBtn');
const ico=document.getElementById('ico');
const fill=document.getElementById('fill');
const bar=document.getElementById('bar');
const cur=document.getElementById('cur');
const dur=document.getElementById('dur');
const songsContainer=document.getElementById('songsContainer');
const songTitle=document.getElementById('songTitle');
const songArtist=document.getElementById('songArtist');
const songInfo=document.getElementById('songInfo');
const ttContainer=document.getElementById('ttContainer');
const playlistContainer=document.getElementById('playlistContainer');

let sonando=false;
let current=0;
let tracks=[
  {name:'Nuyoo',artist:'Spike Black',src:'nuyoo.mp3',info:'Nuyoo • Single • 2:45'},
  {name:'Want You Bad',artist:'The Offspring',src:'The-Offspring-Want-You-Bad.mp3',info:'The Offspring • Smash'}
];

function fmt(s){let m=Math.floor(s/60);let sc=Math.floor(s%60);return m+':'+(sc<10?'0'+sc:sc)}
function updateList(){
  songsContainer.innerHTML='';
  tracks.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='song-item'+(i===current?' active':'');
    d.textContent=t.name+' - '+t.artist;
    d.onclick=()=>load(i, i>current?'next':'prev');
    songsContainer.appendChild(d);
  });
}
function anim(dir){
  ttContainer.classList.remove('slideL','slideR');
  playlistContainer.classList.remove('slideL','slideR');
  void ttContainer.offsetWidth;
  if(dir==='next'){ttContainer.classList.add('slideL');playlistContainer.classList.add('slideL');}
  else{ttContainer.classList.add('slideR');playlistContainer.classList.add('slideR');}
}
function load(i,dir='next'){
  current=i;
  const t=tracks[i];
  songTitle.textContent=t.name;
  songArtist.textContent=t.artist;
  songInfo.textContent=t.info;
  anim(dir);
  updateList();
  rola.src=t.src;
  rola.load();
  if(sonando) rola.play().catch(()=>{});
}
playBtn.onclick=()=>{
  if(!sonando){
    rola.play().then(()=>{sonando=true;ico.innerHTML='<rect x="6" y="5" width="4" height="14" rx="1" fill="#000"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#000"/>';}).catch(()=>alert('No carga: '+tracks[current].src+' revisa que el mp3 esté en la misma carpeta'));
  }else{rola.pause();sonando=false;ico.innerHTML='<path fill="#000" d="M8 5.8v12.4L19 12z"/>';}
};
backBtn.onclick=()=>load((current-1+tracks.length)%tracks.length,'prev');
nextBtn.onclick=()=>load((current+1)%tracks.length,'next');
bar.onclick=e=>{const r=bar.getBoundingClientRect();rola.currentTime=((e.clientX-r.left)/r.width)*rola.duration;};
rola.addEventListener('timeupdate',()=>{if(rola.duration){fill.style.width=(rola.currentTime/rola.duration*100)+'%';cur.textContent=fmt(rola.currentTime);dur.textContent=fmt(rola.duration);}});
rola.addEventListener('ended',()=>nextBtn.click());

// inicio
rola.src=tracks[0].src;
updateList();
</script>
</body>
</html>
