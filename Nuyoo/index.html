<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nuyoo - Spike Black</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;min-height:100vh;padding-bottom:70px}
.cover{
 width:84%;max-width:340px;aspect-ratio:1/1;margin:14px auto 0;
 border-radius:20px;background:#050505;
 border:2px solid #1aff80;
 box-shadow:0 0 10px #00ff88,0 0 30px rgba(0,255,136,.7),0 0 70px rgba(0,255,136,.35);
 overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tt{text-align:center;margin-top:18px;transition:.3s}
.tt h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
.tt p{font-size:14px;color:#9a9a9a;margin-top:2px}
.tt span{font-size:11px;color:#4a4a4a;margin-top:4px;display:block}
@keyframes L{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
@keyframes R{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:translateX(0)}}
.tt.goL{animation:L.32s ease}
.tt.goR{animation:R.32s ease}
.playlist.goL{animation:L.32s ease}
.playlist.goR{animation:R.32s ease}
.ctrl{max-width:360px;margin:18px auto 0;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.ctrl button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.btn-heart svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.6}
.btn-small{opacity:.7}
.play{width:62px;height:62px;background:#00ff88!important;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #00ff88,0 0 35px rgba(0,255,136,.8);border:none;flex-shrink:0}
#ico{width:26px;height:26px;display:block}
.barW{max-width:360px;margin:22px auto 0;padding:0 20px}
.bar{height:4px;background:#222;border-radius:10px;position:relative;cursor:pointer}
.fill{height:100%;background:#00ff88;width:0%;border-radius:10px;box-shadow:0 0 6px #00ff88}
.time{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#666}
.time b{color:#00ff88;font-weight:400}
.actions{max-width:360px;margin:22px auto 0;display:flex;justify-content:space-between;padding:0 24px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;color:#6b6b6b;font-size:9px}
.act svg{width:18px;height:18px;stroke:#6b6b6b;fill:none;stroke-width:1.5}
.lyrics{max-width:360px;margin:26px auto 0;padding:0 20px}
.ly-head{display:flex;justify-content:space-between;font-size:10px;margin-bottom:10px}
.ly-head b:first-child{color:#1aff80;letter-spacing:.5px}
.ly-head b:last-child{color:#1aff80;font-weight:400}
.lyrics p{font-size:12px;line-height:1.7;color:#6e6e73}
.playlist{max-width:360px;margin:22px auto 0;padding:0 20px}
.pl-title{font-size:10px;color:#00ff88;letter-spacing:.8px;margin-bottom:10px}
.song{padding:10px 12px;border-radius:10px;background:#111;border:1px solid #222;display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px;cursor:pointer;color:#fff}
.song.active{background:#00ff88;color:#000;border-color:#00ff88}
.nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:#070707;border-top:1px solid #151515;display:flex;justify-content:space-around;align-items:center;font-size:8px;color:#555}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px}
.nav.on{color:#1aff80}
</style>
</head>
<body>
<audio id="rola" preload="auto" playsinline></audio>
<div class="cover"><img src="nuyoo.gif"></div>
