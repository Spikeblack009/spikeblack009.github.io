<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuyoo - Apple Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:90px}
/* COVER ESTILO APPLE - FIJO */
.art{width:82%;max-width:340px;aspect-ratio:1/1;margin:24px auto 0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.art img{width:100%;height:100%;object-fit:cover;display:block}

.tt{text-align:left;max-width:380px;margin:20px auto 0;padding:0 24px}
.tt h1{font-size:22px;font-weight:700;letter-spacing:-.4px;color:#1d1d1f}
.tt p{color:#fa243c;font-size:15px;font-weight:400;margin-top:2px}
.tt span{color:#86868b;font-size:12px;margin-top:4px;display:block;font-weight:400}

@keyframes left{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes right{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.tt.slideL{animation:left.35s cubic-bezier(.2,.8,.2,1)}
.tt.slideR{animation:right.35s cubic-bezier(.2,.8,.2,1)}
.playlist.slideL{animation:left.35s cubic-bezier(.2,.8,.2,1)}
.playlist.slideR{animation:right.35s cubic-bezier(.2,.8,.2,1)}

.ctrl{max-width:380px;margin:24px auto 0;display:flex;justify-content:center;align-items:center;gap:38px;padding:0 24px}
.ctrl button{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ic{width:26px;height:26px;fill:#1d1d1f}
.play{width:56px;height:56px;background:#1d1d1f!important;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.2)}

.barW{max-width:380px;margin:20px auto 0;padding:0 24px}
.bar{height:3px;background:#e5e5ea;border-radius:10px;cursor:pointer}
.fill{height:100%;background:#1d1d1f;width:0%;border-radius:10px}
.time{display:flex;justify-content:space-between;font-size:10px;color:#86868b;margin-top:8px;font-weight:500;letter-spacing:.3px}

.playlist{max-width:380px;margin:28px auto 0;padding:0 24px}
.playlist-title{font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:12px}
.song-item{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid transparent;transition:.2s}
.song-item.active{background:#1d1d1f;color:#fff}
.song-item span:last-child{font-size:11px;opacity:.6}
</style>
</head>
<body>
<audio id="rola" preload="auto"></audio>

<div class="art" id="artLogo"><img src="nuyoo.gif" onerror="this.src='nuyoo.GIF'"></div>

<div class="tt" id="ttContainer"><h1 id="songTitle">Nuyoo</h1><p id="songArtist">Spike Black</p><span id="songInfo">Nuyoo • Single • 2024</span></div>

<div class="ctrl">
<button id="backBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M7 12L19 4v16L7 12zM5 4h2v16H5z"/></svg></button>
<button class="play" id="playBtn"><svg id="ico" width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" d="M8 5.8v12.4L19 12z"/></svg></button>
<button id="nextBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12l12-8v16L5 12zM19 4h2v16h
